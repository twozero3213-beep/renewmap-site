# 배포가 끝날 때마다 공개 사이트를 휴대폰(lighthouserc.json)과 데스크톱(lighthouserc.desktop.json)으로 잰다(GoogleChrome/lighthouse-ci).
# 접근성·검색 점수가 떨어지거나 화면 밀림(CLS)·가장 큰 그림(LCP)이 래칫 상한을 넘으면 실패(빨간 X)한다(2026-11-20 C11).
# 배포는 막지 않는다(pages.yml의 deploy.needs는 ui뿐). 원래 목표(CLS 0.1, LCP 2.5초)와 성능 점수는 경고로 남긴다.
# 상한은 고칠 때마다 낮춘다. 보고서는 실행 결과 파일로만 남기고 외부에 올리지 않는다.
# 상한 값·판정 방식(LCP는 여러 번 잰 것 중 가장 좋은 값)과 그 근거(이 러너의 실측)는 원본 저장소 ops/site/README.md
# '2026-11-22 Claude: Lighthouse LCP 예산을 러너 실측으로 다시 정함' 절에 적는다. 상한을 바꾸면 그 절도 함께 고친다.
name: lighthouse
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: true
jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { form: mobile, config: lighthouserc.json }
          - { form: desktop, config: lighthouserc.desktop.json }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./.github/${{ matrix.config }}
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.form }}
          temporaryPublicStorage: false
