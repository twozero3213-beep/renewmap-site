name: browser-ui
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python .github/ui_smoke.py --output "$RUNNER_TEMP/ui-results"
      - run: python .github/task_flow_smoke.py --output "$RUNNER_TEMP/ui-results/task-flow"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ui-results
          path: ${{ runner.temp }}/ui-results/
          retention-days: 7
