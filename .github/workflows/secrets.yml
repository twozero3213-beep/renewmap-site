# 키·토큰이 커밋에 들어가지 않았는지 이력 전체를 검사한다. 공개 브라우저 키 3개는 .gitleaks.toml에서 뺀다
name: secrets
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: gitleaks 8.30.1 (공식 릴리스, 해시 고정)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
