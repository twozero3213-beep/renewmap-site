# 공개 사이트 배포(2026-11-07 대표 결정). 브랜치 배포와 공식 deploy-pages 동작은 모두 업로드 대기를 10분에서 끊고
# 배포를 취소한다(deploy-pages 코드의 MAX_TIMEOUT = 600000). 기준연도 2025 전환(파일 4,685개)이 그 안에 끝나지 않아
# 네 번 연속 반영되지 않았다. 같은 Pages 배포 API(POST·GET pages/deployments)를 직접 불러, 취소하지 않고 40분까지 기다린다
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  ui:
    uses: ./.github/workflows/ui.yml
  deploy:
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: https://twozero3213-beep.github.io/renewmap-site/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: . }
      - name: Pages 배포(최대 40분 대기, 시간 초과 때 취소하지 않음)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: context.runId });
            const art = arts.find(a => a.name === 'github-pages');
            if (!art) throw new Error('github-pages 묶음을 찾지 못함');
            const oidc = await core.getIDToken();
            const res = await github.request('POST /repos/{owner}/{repo}/pages/deployments',
              { owner, repo, artifact_id: art.id, pages_build_version: context.sha, oidc_token: oidc });
            const id = res.data.id || String(res.data.status_url || '').split('/').pop();
            core.info(`배포 ${id}, 묶음 ${art.size_in_bytes} bytes, 응답 ${JSON.stringify(res.data).slice(0, 300)}`);
            const FINAL = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const start = Date.now();
            while (Date.now() - start < 40 * 60 * 1000) {
              await new Promise(r => setTimeout(r, 20000));
              let s;
              let d;
              try { d = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })).data; s = d.status; }
              catch (e) { core.warning(`상태 조회 실패: ${e.status || e.message}`); continue; }
              core.info(`상태: ${s} (${Math.round((Date.now() - start) / 1000)}초)`);
              if (!s) core.info(`응답 원문: ${JSON.stringify(d).slice(0, 300)}`);   // 상태가 비면 무엇이 오는지 남긴다(2026-11-07 40분 빈 상태)
              if (s === 'succeed') return;
              if (FINAL.includes(s)) throw new Error(`배포 실패: ${s}`);
            }
            throw new Error('40분 안에 끝나지 않음(배포는 취소하지 않았다. 잠시 뒤 공개 사이트를 확인)');
