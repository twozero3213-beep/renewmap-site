<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
<meta name="robots" content="noindex">
<title>리뉴맵 캐릭터</title>
<link rel="stylesheet" href="../pretendard.css">
<link rel="stylesheet" href="preview.css">
</head>
<body>
<main class="mp">
  <h1>리뉴맵 캐릭터</h1>
  <p class="mp-lead">같은 몸 비율 · 같은 눈 · 같은 발. 모양만 보고도 하는 일을 압니다.</p>

  <ul class="mp-who">
    <li><img src="crew/ieum-default.svg" width="64" height="64" alt=""><div><b>이음</b> 지도 핀 + 고리 · 동네와 자료를 잇고 찾습니다.</div></li>
    <li><img src="crew/saeum-default.svg" width="64" height="64" alt=""><div><b>새움</b> 작은 건물 + 안전모 · 낡은 곳을 다시 세우는 현장 담당.</div></li>
    <li><img src="crew/taggy-default.svg" width="64" height="64" alt=""><div><b>태기</b> 근거 꼬리표 + 확인 표시 · 출처와 기준일을 붙입니다.</div></li>
  </ul>

  <section class="mp-row" aria-labelledby="h-ieum">
    <h2 id="h-ieum">이음</h2>
    <div class="mp-cards">
      <figure><img src="crew/ieum-default.svg" width="160" height="160" alt="이음 기본: 지도 핀 몸, 점선 길 끝에 목적지"><figcaption>기본</figcaption></figure>
      <figure><img src="crew/ieum-search.svg" width="160" height="160" alt="이음 찾기: 돋보기를 든다"><figcaption>찾기</figcaption></figure>
    </div>
  </section>

  <section class="mp-row" aria-labelledby="h-saeum">
    <h2 id="h-saeum">새움</h2>
    <div class="mp-cards">
      <figure><img src="crew/saeum-default.svg" width="160" height="160" alt="새움 기본: 안전모를 쓴 작은 건물"><figcaption>기본</figcaption></figure>
      <figure><img src="crew/saeum-field.svg" width="160" height="160" alt="새움 현장: 비계 옆에서 망치를 든다"><figcaption>현장</figcaption></figure>
      <figure><img src="crew/saeum-waiting.svg" width="160" height="160" alt="새움 기다림: 말풍선을 띄우고 위를 본다"><figcaption>기다림</figcaption></figure>
    </div>
  </section>

  <section class="mp-row" aria-labelledby="h-taggy">
    <h2 id="h-taggy">태기</h2>
    <div class="mp-cards">
      <figure><img src="crew/taggy-default.svg" width="160" height="160" alt="태기 기본: 꼬리표 몸에 확인 표시"><figcaption>기본</figcaption></figure>
      <figure><img src="crew/taggy-check.svg" width="160" height="160" alt="태기 확인 중: 점검표를 들고 살핀다, 가슴 표시는 점선"><figcaption>확인 중</figcaption></figure>
      <figure><img src="crew/taggy-confirmed.svg" width="160" height="160" alt="태기 확인 끝: 확인 표시를 높이 든다"><figcaption>확인 끝</figcaption></figure>
      <figure><img src="taggy-field.svg" width="130" height="160" alt="태기 현장: 위치 깃발을 꽂는다"><figcaption>현장</figcaption></figure>
      <figure><img src="taggy-waiting.svg" width="130" height="160" alt="태기 기다림: 말풍선을 띄우고 위를 본다"><figcaption>기다림</figcaption></figure>
    </div>
  </section>

  <section class="mp-row" aria-labelledby="h-size">
    <h2 id="h-size">작게 써도 보이는지</h2>
    <div class="mp-sizes">
      <img src="crew/ieum-default.svg" width="48" height="48" alt="이음 48픽셀">
      <img src="crew/saeum-default.svg" width="48" height="48" alt="새움 48픽셀">
      <img src="crew/taggy-default.svg" width="48" height="48" alt="태기 48픽셀">
      <img src="crew/ieum-default.svg" width="32" height="32" alt="이음 32픽셀">
      <img src="crew/saeum-default.svg" width="32" height="32" alt="새움 32픽셀">
      <img src="crew/taggy-default.svg" width="32" height="32" alt="태기 32픽셀">
    </div>
  </section>

  <p class="mp-src">색: 사이트 청록(#0b6b75) · 짙은 청록(#085760) · 안전모 주황(#e8b86d) · 기준일 2026-11-22</p>
</main>
</body>
</html>
